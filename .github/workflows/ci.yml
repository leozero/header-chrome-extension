name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      - run: npm run check
      - name: Install Chrome for Testing
        run: echo "CHROME_PATH=$(npx -y @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome" | tail -1 | cut -d' ' -f2-)" >> "$GITHUB_ENV"
      - run: npm run e2e
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: header-injector-${{ github.sha }}
          path: dist/*.zip
          retention-days: 14
