name: Release

# Two ways to release:
#   1. Locally: `npm version patch|minor|major` bumps package.json + manifest.json,
#      commits, tags vX.Y.Z and pushes -> this workflow runs on the tag.
#   2. From GitHub: Actions > Release > Run workflow, pick the bump. The workflow
#      bumps, commits, tags and publishes in one go.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Test
        run: npm test

      - name: Bump version, commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$BUMP" -m "chore(release): v%s"

      - name: Resolve tag
        id: tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          else
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Check manifest
        run: node scripts/check.mjs "${{ steps.tag.outputs.name }}"

      - name: Package
        run: npm run package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --verify-tag \
            --title "Header Injector $TAG" \
            --generate-notes

      # Runs once the Chrome Web Store is configured (see docs/PUBLISHING.md):
      # repository variables CWS_PUBLISHER_ID / CWS_EXTENSION_ID and credentials in secrets.
      - name: Publish to the Chrome Web Store
        if: vars.CWS_EXTENSION_ID != ''
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISH_TYPE: ${{ vars.CWS_PUBLISH_TYPE }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npm run publish-store
